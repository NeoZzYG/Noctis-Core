<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Espace admin · Noctis Core</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#c69428">
<link rel="icon" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Cinzel:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="tricolore"></div>
<header class="entete">
  <div class="wrap">
    <a class="marque" href="/"><img src="/assets/logo-mini.png" alt="" onerror="this.remove()">NOCTIS CORE</a>
    <nav class="nav" aria-label="Navigation principale">
      <a href="/" >Accueil</a>
      <a href="/tournois.html">Tournois</a>
      <a href="/palmares.html">Palmarès</a>
      <a href="/boutique.html">Boutique</a>
      <a href="/partenaires.html">Partenaires</a>
      <a href="/streamers.html">Streamers</a>
    </nav>
    <div id="compte"></div>
  </div>
</header>
<nav class="nav-mobile" aria-label="Navigation mobile">
  <a href="/" >Accueil</a>
  <a href="/tournois.html">Tournois</a>
  <a href="/palmares.html">Palmarès</a>
  <a href="/boutique.html">Boutique</a>
      <a href="/partenaires.html">Partenaires</a>
      <a href="/streamers.html">Streamers</a>
</nav>
<main>
<section class="page-tete page-tete-admin">
  <h1>Espace admin</h1>
  <div class="filet" aria-hidden="true"><i></i><i></i><i></i></div>
  <p class="devise">Gère le site sans toucher au code</p>
</section>

<section class="bloc admin" id="admin">
  <div class="wrap">
    <p class="events-vide" id="admin-chargement">Chargement…</p>
  </div>
</section>
</main>
<footer class="pied">
  <div class="wrap">
    <span>© 2026 Noctis Core [NcG]</span>
    <nav aria-label="Réseaux">
      <a data-discord href="#">Discord</a>
      <a data-twitch href="#">Twitch</a>
    </nav>
  </div>
</footer>
<script src="/app.js"></script>
<script>
  const racine = document.querySelector("#admin .wrap");
  const JEUX_CONNUS = THEMES_JEUX.map((t) => t.nom);
  const JEUX_TOURNOIS = NOCTIS.jeuxTournois || ["League of Legends", "Call of Duty", "Valorant"];

  const SCHEMA = {
    jeux: { label: "Jeux", aide: "Les jeux de la commu, affichés sur l'accueil. Leur couleur et leur sigle sont repris sur les events et tournois du même jeu.",
      nouveau: () => ({ nom: "", sigle: "", couleur: "#c69428", detail: "", image: "" }), apercu: (j) => j.nom || "Nouveau jeu",
      champs: [{ k: "nom", l: "Nom du jeu", t: "text", ph: "League of Legends" }, { k: "sigle", l: "Sigle (5 lettres max)", t: "text", ph: "LoL" },
        { k: "couleur", l: "Couleur", t: "color" }, { k: "detail", l: "Petite description", t: "text", ph: "Customs et Flex tous les soirs", large: 1 }, { k: "image", l: "Visuel (format portrait)", t: "image" }] },
    events: { label: "Events", aide: "Les soirées du mois (Soirée LoL, Soirée CoD…). Elles s'affichent sur l'accueil avec leur décompte, et les membres s'inscrivent en un clic.",
      nouveau: () => ({ titre: "Soirée ", jeu: "", ambiance: "chill", date: "", places: null, description: "", image: "" }), apercu: (e) => `${e.titre || "Nouvel event"}${e.ambiance === "competitif" ? " · Compétitif" : " · Chill"}`,
      champs: [{ k: "titre", l: "Titre", t: "text", ph: "Soirée Among Us" },
        { k: "jeu", l: "Jeu (liste de l'onglet Jeux)", t: "select", options: () => [["", "— Aucun jeu précis —"], ...etat.jeux.filter((j) => j.nom).map((j) => [j.nom, j.nom])] },
        { k: "ambiance", l: "Ambiance", t: "select", options: [["chill", "☾ Chill"], ["competitif", "⚔ Compétitif"]] }, { k: "date", l: "Date et heure", t: "datetime" },
        { k: "places", l: "Places max", t: "number", ph: "Vide = illimité" }, { k: "description", l: "Description", t: "textarea", large: 1 }, { k: "image", l: "Image de couverture (optionnel)", t: "image" }] },
    tournois: { label: "Tournois", aide: "Les tournois officiels, affichés sur la page Tournois avec le décompte et la jauge d'inscrits.",
      nouveau: () => ({ titre: "Tournoi ", jeu: JEUX_TOURNOIS[0] || "", date: "", format: "", places: 16, recompense: "", description: "", image: "" }), apercu: (e) => e.titre || "Nouveau tournoi",
      champs: [{ k: "titre", l: "Titre", t: "text", ph: "Noctis Cup #1" }, { k: "jeu", l: "Jeu", t: "select", options: () => JEUX_TOURNOIS.map((j) => [j, j]) }, { k: "date", l: "Date et heure", t: "datetime" },
        { k: "format", l: "Format", t: "text", ph: "5v5 · élimination directe" }, { k: "places", l: "Places max", t: "number", ph: "Vide = illimité" },
        { k: "recompense", l: "Récompense", t: "text", ph: "Rôle Champion + 20 € de RP" }, { k: "description", l: "Description", t: "textarea", large: 1 }, { k: "image", l: "Image de couverture (optionnel)", t: "image" }] },
    staff: { label: "Staff", aide: "Les membres du staff mis en avant dans « La team » sur l'accueil, avec leur statut sur le site. Être dans le staff ne donne PAS accès à l'admin.",
      nouveau: () => ({ nom: "", role: "", couleur: "#c69428", avatar: "" }), apercu: (s) => `${s.nom || "Nouveau membre"}${s.role ? ` · ${s.role}` : ""}${s.username ? ` (@${s.username})` : ""}`,
      champs: [{ k: "nom", l: "Pseudo affiché", t: "text" }, { k: "role", l: "Rôle", t: "text", ph: "Modérateur" }, { k: "couleur", l: "Couleur du rôle", t: "color" },
        { k: "avatar", l: "Photo perso (optionnel : sinon sa photo Discord)", t: "image" }] },
    produits: { label: "Boutique", aide: "Les articles de la boutique. Pour vendre, colle le lien de paiement Stripe (Payment Link) du produit.",
      nouveau: () => ({ nom: "", prix: 0, description: "", tailles: "XS, S, M, L, XL, XXL, XXXL", images: [], lien: "", membres: false }), apercu: (p) => p.nom || "Nouveau produit",
      champs: [{ k: "nom", l: "Nom", t: "text", ph: "Hoodie Noctis" }, { k: "prix", l: "Prix (€)", t: "number" }, { k: "tailles", l: "Tailles disponibles", t: "text", ph: "XS, S, M, L, XL, XXL, XXXL (vide = taille unique)" },
        { k: "description", l: "Description (matière, coupe, détails…)", t: "textarea", large: 1 },
        { k: "lien", l: "Lien de paiement (vide = « Bientôt »)", t: "text", ph: "https://buy.stripe.com/…", large: 1 },
        { k: "membres", l: "Réservé aux membres du serveur", t: "checkbox" }, { k: "images", l: "Photos (la 1re est la photo principale, 8 max)", t: "galerie" }] },
    palmares: { label: "Palmarès", aide: "Les cups auxquelles une équipe Noctis a participé : la cup, qui l'organisait, le jeu, le nombre d'équipes et de joueurs, notre équipe et ses joueurs. Les joueurs choisis dans la liste des membres sont reliés à leur profil.",
      nouveau: () => ({ tournoi: "", organisateur: "", jeu: "", date: new Date().toISOString().slice(0, 10), nbEquipes: null, nbJoueurs: null, equipe: "", place: null, joueurs: [], image: "" }),
      apercu: (p) => p.tournoi ? `${p.tournoi}${p.place ? ` · ${medaille(p.place)}` : ""}${p.equipe ? ` · ${p.equipe}` : ""}` : "Nouvelle cup",
      champs: [{ k: "tournoi", l: "Nom de la cup", t: "text", ph: "Winter Cup 2026" }, { k: "organisateur", l: "Organisé par", t: "text", ph: "Nom de la structure" },
        { k: "jeu", l: "Jeu", t: "select", options: () => [["", "— Choisir —"], ...[...new Set([...JEUX_TOURNOIS, ...etat.jeux.map((j) => j.nom).filter(Boolean)])].map((j) => [j, j])] },
        { k: "date", l: "Date", t: "date" }, { k: "nbEquipes", l: "Nombre d'équipes", t: "number" }, { k: "nbJoueurs", l: "Nombre de joueurs", t: "number" },
        { k: "equipe", l: "Nom de notre équipe", t: "text", ph: "Noctis Core" }, { k: "place", l: "Classement obtenu (optionnel)", t: "number", ph: "1 = vainqueur" },
        { k: "joueurs", l: "Joueurs de notre équipe", t: "joueurs" }, { k: "image", l: "Image de la cup (affiche ou bannière, format large idéal)", t: "image" }] },
    partenaires: { label: "Partenaires", aide: "Les structures partenaires, affichées sur la page Partenaires avec leur logo et le lien de leur Discord.",
      nouveau: () => ({ nom: "", logo: "", description: "", discord: "", site: "" }), apercu: (s) => s.nom || "Nouveau partenaire",
      champs: [{ k: "nom", l: "Nom de la structure", t: "text" }, { k: "discord", l: "Lien d'invitation Discord", t: "text", ph: "https://discord.gg/…" }, { k: "site", l: "Site ou réseau (optionnel)", t: "text", ph: "https://…" },
        { k: "description", l: "Présentation", t: "textarea", large: 1 }, { k: "logo", l: "Logo (carré, fond transparent idéal)", t: "image" }] },
    streamers: { label: "Streamers", aide: "Les streamers Noctis et partenaires, affichés sur la page Streamers. Relie-les à leur compte du site pour reprendre leur photo et leur profil.",
      nouveau: () => ({ nom: "", type: "noctis", plateforme: "twitch", lien: "", membre: "", membreId: "", avatar: "", description: "" }), apercu: (s) => `${s.nom || "Nouveau streamer"} · ${s.type === "partenaire" ? "Partenaire" : "Noctis"}`,
      champs: [{ k: "nom", l: "Pseudo", t: "text" }, { k: "type", l: "Catégorie", t: "select", options: [["noctis", "Streamer Noctis"], ["partenaire", "Streamer partenaire"]] },
        { k: "plateforme", l: "Plateforme", t: "select", options: [["twitch", "Twitch"], ["youtube", "YouTube"], ["tiktok", "TikTok"], ["kick", "Kick"]] },
        { k: "lien", l: "Lien de la chaîne", t: "text", ph: "https://www.twitch.tv/…", large: 1 }, { k: "membre", l: "Compte sur le site (optionnel)", t: "membre", lien: "membreId" },
        { k: "description", l: "Petite phrase (optionnel)", t: "text", ph: "Ranked LoL tous les soirs", large: 1 }, { k: "avatar", l: "Photo (optionnel : sinon celle de son compte)", t: "image" }] },
    reglement: { label: "Règlement", aide: "Les règles affichées en bas de la page Tournois, une par ligne.",
      nouveau: () => ({ texte: "" }), apercu: (r, i) => `Règle ${i + 1}`, champs: [{ k: "texte", l: "Règle", t: "textarea", large: 1 }] },
  };

  let etat = {}, onglet = "events", modifie = false, majInfo = "";
  const id = () => Math.random().toString(36).slice(2, 10);
  const versLocal = (iso) => { if (!iso) return ""; const d = new Date(iso); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16); };
  const versISO = (v) => (v ? new Date(v).toISOString() : "");

  function champ(c, v, i) {
    const attr = `data-i="${i}" data-k="${c.k}"`;
    const lab = `<span class="lab">${esc(c.l)}</span>`;
    const cls = `champ${c.large ? " large" : ""}`;
    switch (c.t) {
      case "textarea": return `<label class="${cls}">${lab}<textarea ${attr} rows="3">${esc(v || "")}</textarea></label>`;
      case "number": return `<label class="${cls}">${lab}<input type="number" min="0" step="any" ${attr} value="${v == null ? "" : esc(v)}" placeholder="${esc(c.ph || "")}"></label>`;
      case "datetime": return `<label class="${cls}">${lab}<input type="datetime-local" ${attr} value="${versLocal(v)}"></label>`;
      case "date": return `<label class="${cls}">${lab}<input type="date" ${attr} value="${esc(v || "")}"></label>`;
      case "color": return `<label class="${cls}">${lab}<span class="couleur"><input type="color" ${attr} value="${esc(v || "#c69428")}"><code>${esc(v || "#c69428")}</code></span></label>`;
      case "select": {
        const opts = typeof c.options === "function" ? c.options() : c.options;
        const liste = v && !opts.some(([val]) => val === v) ? [[v, v], ...opts] : opts; // garde une ancienne valeur
        return `<label class="${cls}">${lab}<select ${attr}>${liste.map(([val, txt]) => `<option value="${esc(val)}"${val === (v || opts[0][0]) ? " selected" : ""}>${esc(txt)}</option>`).join("")}</select></label>`;
      }
      case "checkbox": return `<label class="${cls} case"><input type="checkbox" ${attr}${v ? " checked" : ""}>${esc(c.l)}</label>`;
      case "jeu": return `<label class="${cls}">${lab}<input type="text" list="liste-jeux" ${attr} value="${esc(v || "")}" placeholder="Choisis ou tape un jeu"></label>`;
      case "image": return `<div class="${cls} large champ-image">${lab}<div class="img-ligne">
          <div class="img-apercu">${v ? `<img src="${esc(v)}" alt="">` : "<span>Aucune image</span>"}</div>
          <div class="img-boutons"><label class="btn btn-ghost">${v ? "Changer" : "Choisir une image"}<input type="file" accept="image/*" data-img data-i="${i}" data-k="${c.k}" hidden></label>
          ${v ? `<button type="button" class="btn btn-ghost" data-act="retirer" data-i="${i}" data-k="${c.k}">Retirer</button>` : ""}</div></div></div>`;
      case "membre": return `<label class="${cls}">${lab}<input type="text" list="liste-membres-site" ${attr} value="${esc(v || "")}" placeholder="Tape un pseudo du site…" autocomplete="off"></label>`;
      case "joueurs": {
        const l = Array.isArray(v) ? v : [];
        return `<div class="champ large">${lab}<div class="chips">${l.map((j, m) => `<span class="chip${j.membreId ? " lie" : ""}" title="${j.membreId ? "Relié au profil" : "Pas de compte sur le site"}">${j.avatar ? `<img src="${esc(j.avatar)}" alt="">` : ""}${esc(j.nom)}<button type="button" data-act="jr-retirer" data-i="${i}" data-m="${m}" aria-label="Retirer ${esc(j.nom)}">×</button></span>`).join("")}
          <input type="text" class="ajout-joueur" list="liste-membres-site" data-jr="ajout" data-i="${i}" placeholder="+ Ajouter un joueur (Entrée)" autocomplete="off"></div></div>`;
      }
      case "classement": {
        const l = Array.isArray(v) ? v : [];
        return `<div class="champ large champ-classement">${lab}
          ${l.map((r, n) => `<div class="ligne-classement">
            <span class="place-cl">${medaille(n + 1)}</span>
            <div class="cl-contenu">
              <input type="text" data-cl="equipe" data-i="${i}" data-n="${n}" value="${esc(r.equipe || "")}" placeholder="Nom de l'équipe (ou du joueur en solo)">
              <div class="chips">${(r.joueurs || []).map((j, m) => `<span class="chip${j.membreId ? " lie" : ""}" title="${j.membreId ? "Relié au profil" : "Pas de compte sur le site"}">${j.avatar ? `<img src="${esc(j.avatar)}" alt="">` : ""}${esc(j.nom)}<button type="button" data-act="cl-retirer" data-i="${i}" data-n="${n}" data-m="${m}" aria-label="Retirer ${esc(j.nom)}">×</button></span>`).join("")}
                <input type="text" class="ajout-joueur" list="liste-membres-site" data-cl="joueur" data-i="${i}" data-n="${n}" placeholder="+ Ajouter un joueur (Entrée)" autocomplete="off"></div>
            </div>
            <button type="button" class="suppr-cl" data-act="cl-suppr" data-i="${i}" data-n="${n}" aria-label="Retirer cette place">✕</button>
          </div>`).join("")}
          <button type="button" class="btn btn-ghost ajout-place" data-act="cl-ajouter" data-i="${i}">+ Ajouter une place</button></div>`;
      }
      case "galerie": {
        const l = Array.isArray(v) ? v : [];
        return `<div class="${cls} large champ-galerie">${lab}<div class="galerie-admin">
          ${l.map((u, n) => `<figure><img src="${esc(u)}" alt="">${n === 0 ? "<figcaption>Principale</figcaption>" : ""}
            <span class="gal-outils">
              <button type="button" data-act="gal-gauche" data-i="${i}" data-k="${c.k}" data-n="${n}" ${n === 0 ? "disabled" : ""} aria-label="Avancer">←</button>
              <button type="button" data-act="gal-suppr" data-i="${i}" data-k="${c.k}" data-n="${n}" aria-label="Retirer">✕</button>
              <button type="button" data-act="gal-droite" data-i="${i}" data-k="${c.k}" data-n="${n}" ${n === l.length - 1 ? "disabled" : ""} aria-label="Reculer">→</button>
            </span></figure>`).join("")}
          ${l.length < 8 ? `<label class="gal-ajout"><input type="file" accept="image/*" multiple data-galerie data-i="${i}" data-k="${c.k}" hidden><span>+</span>Ajouter des photos</label>` : ""}
        </div></div>`;
      }
      default: return `<label class="${cls}">${lab}<input type="text" ${attr} value="${esc(v || "")}" placeholder="${esc(c.ph || "")}"></label>`;
    }
  }

  function carte(item, i, total) {
    const s = SCHEMA[onglet];
    const insc = item.inscrits && item.inscrits.length
      ? `<p class="insc-admin"><b>${item.inscrits.length} inscrit${item.inscrits.length > 1 ? "s" : ""}</b> : ${item.inscrits.map((x) => esc(x.nom)).join(", ")}</p>` : "";
    return `<article class="carte-admin">
      <header><strong data-apercu="${i}">${esc(s.apercu(item, i))}</strong>
        <span class="outils">
          <button type="button" data-act="haut" data-i="${i}" ${i === 0 ? "disabled" : ""} aria-label="Monter">↑</button>
          <button type="button" data-act="bas" data-i="${i}" ${i === total - 1 ? "disabled" : ""} aria-label="Descendre">↓</button>
          <button type="button" data-act="suppr" data-i="${i}" class="suppr">Supprimer</button>
        </span></header>
      <div class="champs">${s.champs.map((c) => champ(c, item[c.k], i)).join("")}</div>${insc}
      ${onglet === "staff" && item.membreId ? `<p class="insc-admin">${(item.avatarAuto || item.avatarDiscord) && !item.avatar ? `<img class="mini-av" src="${esc(item.avatarAuto || item.avatarDiscord)}" alt="">` : ""}Relié au compte Discord${item.username ? ` <b>@${esc(item.username)}</b>` : ""} · ${statutStaff(item) || "statut inconnu"}</p>` : ""}
    </article>`;
  }

  const nav = () => `<nav class="onglets" aria-label="Sections">${Object.entries(SCHEMA).map(([k, v]) =>
      `<button type="button" data-onglet="${k}"${k === onglet ? ' aria-current="true"' : ""}>${v.label}<small>${etat[k].length}</small></button>`).join("")}
      <button type="button" data-onglet="membres"${onglet === "membres" ? ' aria-current="true"' : ""}>Membres${MEMBRES ? `<small>${MEMBRES.length}</small>` : ""}</button></nav>`;

  // ----- Onglet Membres : profils et bannissements -----
  let MEMBRES = null, filtre = "";
  async function chargerMembres() {
    try { MEMBRES = (await (await fetch("/api/admin-membres?tous=1")).json()).membres || []; } catch { MEMBRES = []; }
  }
  function rendreMembres() {
    const t = filtre.toLowerCase();
    const liste = (MEMBRES || []).filter((m) => !t || (m.nom || "").toLowerCase().includes(t) || (m.username || "").toLowerCase().includes(t));
    const bannis = (MEMBRES || []).filter((m) => m.banni).length;
    racine.innerHTML = `${nav()}
      <div class="entete-onglet"><p>Tous les membres déjà venus sur le site${bannis ? ` · <b style="color:#ff6b76">${bannis} banni${bannis > 1 ? "s" : ""}</b>` : ""}. Un membre banni est déconnecté immédiatement et ne peut plus revenir sur le site.</p></div>
      <label class="champ large" style="margin-bottom:1rem"><input type="search" id="filtre-membres" placeholder="Filtrer par pseudo…" value="${esc(filtre)}"></label>
      ${MEMBRES === null ? '<p class="events-vide">Chargement…</p>' : `<ul class="liste-membres">${liste.map((m) => `<li class="${m.banni ? "est-banni" : ""}">
        ${m.avatar ? `<img src="${esc(m.avatar)}" alt="">` : '<span class="av-vide"></span>'}
        <span class="infos-m"><strong>${esc(m.nom)}</strong><small>${m.username ? `@${esc(m.username)} · ` : ""}${m.banni ? `Banni par ${esc(m.banni.par)}${m.banni.raison ? ` : ${esc(m.banni.raison)}` : ""}` : m.vu ? `vu il y a ${depuis(m.vu)}` : "jamais vu"}</small></span>
        <a class="btn btn-ghost" href="/profil.html?id=${esc(m.id)}">Profil</a>
        ${MOI && m.id === MOI.id ? "" : m.banni ? `<button type="button" class="btn btn-ghost" data-ban="debannir" data-id="${esc(m.id)}" data-nom="${esc(m.nom)}">Débannir</button>`
          : `<button type="button" class="btn btn-danger" data-ban="bannir" data-id="${esc(m.id)}" data-nom="${esc(m.nom)}">Bannir</button>`}</li>`).join("") || '<li class="res-info">Aucun membre.</li>'}</ul>`}`;
  }
  racine.addEventListener("input", (ev) => {
    if (ev.target.id !== "filtre-membres") return;
    filtre = ev.target.value; const pos = ev.target.selectionStart;
    rendreMembres(); const f = document.getElementById("filtre-membres"); f.focus(); f.setSelectionRange(pos, pos);
  });
  racine.addEventListener("click", async (ev) => {
    const b = ev.target.closest("[data-ban]"); if (!b) return;
    let raison = "";
    if (b.dataset.ban === "bannir") { raison = prompt(`Bannir ${b.dataset.nom} du site ?\nIl sera déconnecté et ne pourra plus revenir.\n\nRaison (visible par le staff) :`); if (raison === null) return; }
    else if (!confirm(`Redonner l'accès au site à ${b.dataset.nom} ?`)) return;
    b.disabled = true;
    const r = await fetch("/api/admin-ban", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: b.dataset.id, action: b.dataset.ban, raison, nom: b.dataset.nom }) });
    if (!r.ok) { b.disabled = false; alert((await r.json().catch(() => ({}))).erreur === "impossible" ? "Impossible de bannir ce compte (toi-même ou le propriétaire du serveur)." : "Ça n'a pas marché, réessaie."); return; }
    await chargerMembres(); rendreMembres();
  });

  function rendre() {
    if (onglet === "membres") { rendreMembres(); if (MEMBRES === null) chargerMembres().then(rendreMembres); return; }
    const s = SCHEMA[onglet], liste = etat[onglet];
    const noms = [...new Set([...(etat.jeux || []).map((j) => j.nom).filter(Boolean), ...JEUX_CONNUS])];
    racine.innerHTML = `
      ${nav()}
      <div class="entete-onglet"><p>${esc(s.aide)}</p><button type="button" class="btn btn-or" data-act="ajouter">+ Ajouter</button></div>
      ${onglet === "produits" ? `<label class="interrupteur-chantier${etat.reglages.boutiqueEnConstruction ? " actif" : ""}">
        <input type="checkbox" id="chantier"${etat.reglages.boutiqueEnConstruction ? " checked" : ""}>
        <span class="bascule" aria-hidden="true"></span>
        <span><strong>🚧 Boutique en cours de construction</strong><small>Les membres voient les articles avec un bandeau « Bientôt », mais ne peuvent pas commander. Décoche quand tout est prêt.</small></span>
      </label>` : ""}
      ${onglet === "staff" ? `<div class="recherche-membres">
        <label class="champ large"><span class="lab">Ajouter un membre du serveur</span>
          <input type="search" id="q-membre" placeholder="Tape un pseudo Discord…" autocomplete="off"></label>
        <ul id="res-membres" class="res-membres"></ul>
      </div>` : ""}
      <div class="cartes-admin">${liste.length ? liste.map((it, i) => carte(it, i, liste.length)).join("") : '<p class="events-vide">Rien pour l\'instant. Clique sur « + Ajouter ».</p>'}</div>
      <datalist id="liste-membres-site">${(MEMBRES || []).filter((m) => !m.banni).map((m) => `<option value="${esc(valeurMembre(m))}">`).join("")}</datalist>
      <datalist id="liste-jeux">${noms.map((n) => `<option value="${esc(n)}">`).join("")}</datalist>
      <div class="barre-enregistrer${modifie ? " visible" : ""}">
        <span id="statut">${modifie ? "Modifications non enregistrées" : esc(majInfo)}</span>
        <button type="button" class="btn btn-or" data-act="enregistrer"${modifie ? "" : " disabled"}>Enregistrer</button>
      </div>`;
  }

  function marquer() {
    if (modifie) return;
    modifie = true;
    const barre = racine.querySelector(".barre-enregistrer");
    barre.classList.add("visible");
    barre.querySelector("#statut").textContent = "Modifications non enregistrées";
    barre.querySelector("button").disabled = false;
  }

  // Saisie dans les champs
  const saisie = (ev) => {
    const el = ev.target, i = el.dataset.i, k = el.dataset.k;
    if (i == null || !k || el.dataset.img != null || el.dataset.cl || el.dataset.jr) return;
    const c = SCHEMA[onglet].champs.find((x) => x.k === k);
    let v = el.type === "checkbox" ? el.checked : el.value;
    if (onglet === "jeux" && k === "nom") {
      const ancien = etat.jeux[i].nom;
      if (ancien) ["events", "tournois", "palmares"].forEach((l) => etat[l].forEach((e) => { if (e.jeu === ancien) e.jeu = el.value; }));
    }
    if (c.t === "number") v = el.value === "" ? null : Number(el.value);
    if (c.t === "datetime") v = versISO(el.value);
    if (c.t === "membre") { const m = trouverMembre(el.value); etat[onglet][i][c.lien] = m ? m.id : ""; if (m) { v = m.nom; el.value = m.nom; } }
    etat[onglet][i][k] = v;
    if (c.t === "color") el.nextElementSibling.textContent = el.value;
    const ap = racine.querySelector(`[data-apercu="${i}"]`);
    if (ap) ap.textContent = SCHEMA[onglet].apercu(etat[onglet][i], Number(i));
    marquer();
  };
  racine.addEventListener("input", saisie);
  racine.addEventListener("change", (ev) => {
    if (ev.target.id !== "chantier") return;
    etat.reglages.boutiqueEnConstruction = ev.target.checked;
    ev.target.closest(".interrupteur-chantier").classList.toggle("actif", ev.target.checked);
    marquer();
  });
  racine.addEventListener("change", (ev) => { if (ev.target.tagName === "SELECT") saisie(ev); });

  // Galerie : envoi de plusieurs photos d'un coup
  racine.addEventListener("change", async (ev) => {
    const el = ev.target;
    if (el.dataset.galerie == null || !el.files.length) return;
    const cible = etat[onglet][el.dataset.i];
    cible[el.dataset.k] = Array.isArray(cible[el.dataset.k]) ? cible[el.dataset.k] : [];
    const fichiers = [...el.files].slice(0, 8 - cible[el.dataset.k].length);
    el.closest(".gal-ajout").innerHTML = `<span>…</span>Envoi de ${fichiers.length} photo${fichiers.length > 1 ? "s" : ""}`;
    for (const f of fichiers) {
      try { cible[el.dataset.k].push(await envoyerImage(f)); } catch { alert(`La photo « ${f.name} » n'a pas pu être envoyée.`); }
    }
    modifie = true; rendre();
  });

  // Envoi d'image : redimensionnée dans le navigateur avant l'envoi
  racine.addEventListener("change", async (ev) => {
    const el = ev.target;
    if (el.dataset.img == null || !el.files[0]) return;
    const zone = el.closest(".champ-image");
    zone.querySelector(".img-apercu").innerHTML = "<span>Envoi…</span>";
    try {
      const url = await envoyerImage(el.files[0]);
      etat[onglet][el.dataset.i][el.dataset.k] = url;
      modifie = true; rendre();
    } catch (e) {
      alert("L'image n'a pas pu être envoyée. Essaie avec une image plus légère (JPG ou PNG).");
      rendre();
    }
  });

  async function envoyerImage(fichier) {
    const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = URL.createObjectURL(fichier); });
    const max = 1400, r = Math.min(1, max / Math.max(img.width, img.height));
    const cv = document.createElement("canvas");
    cv.width = Math.round(img.width * r); cv.height = Math.round(img.height * r);
    cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
    let data = cv.toDataURL("image/webp", 0.86), type = "image/webp";
    if (!data.startsWith("data:image/webp")) { type = fichier.type === "image/png" ? "image/png" : "image/jpeg"; data = cv.toDataURL(type, 0.86); }
    const res = await fetch("/api/admin-image", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ type, data: data.split(",")[1] }) });
    if (!res.ok) throw new Error("envoi");
    return (await res.json()).url;
  }

  // Boutons
  racine.addEventListener("click", async (ev) => {
    const b = ev.target.closest("button");
    if (!b) return;
    if (b.dataset.onglet) { onglet = b.dataset.onglet; rendre(); return; }
    if (b.dataset.ban || b.dataset.ajoutMembre || (b.dataset.act || "").startsWith("cl-") || b.dataset.act === "jr-retirer") return;
    const liste = etat[onglet], i = Number(b.dataset.i);
    switch (b.dataset.act) {
      case "ajouter": liste.unshift({ id: id(), ...SCHEMA[onglet].nouveau() }); modifie = true; rendre(); racine.querySelector(".carte-admin input, .carte-admin textarea")?.focus(); break;
      case "suppr":
        if (liste[i].inscrits && liste[i].inscrits.length && !confirm(`${liste[i].inscrits.length} membre(s) sont inscrits. Supprimer quand même ?`)) return;
        if (!liste[i].inscrits?.length && !confirm("Supprimer cet élément ?")) return;
        liste.splice(i, 1); modifie = true; rendre(); break;
      case "haut": [liste[i - 1], liste[i]] = [liste[i], liste[i - 1]]; modifie = true; rendre(); break;
      case "bas": [liste[i + 1], liste[i]] = [liste[i], liste[i + 1]]; modifie = true; rendre(); break;
      case "retirer": liste[i][b.dataset.k] = ""; modifie = true; rendre(); break;
      case "gal-suppr": case "gal-gauche": case "gal-droite": {
        const g = liste[i][b.dataset.k], n = Number(b.dataset.n);
        if (b.dataset.act === "gal-suppr") g.splice(n, 1);
        else { const m = b.dataset.act === "gal-gauche" ? n - 1 : n + 1; [g[m], g[n]] = [g[n], g[m]]; }
        modifie = true; rendre(); break;
      }
      case "enregistrer": await enregistrer(b); break;
    }
  });

  async function enregistrer(b) {
    b.disabled = true; b.textContent = "Enregistrement…";
    const contenu = { ...etat, reglement: etat.reglement.map((r) => r.texte).filter((t) => t.trim()) };
    try {
      const r = await fetch("/api/admin", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ contenu }) });
      if (!r.ok) throw new Error(r.status === 403 ? "admin" : "erreur");
      charger((await r.json()).contenu);
      modifie = false;
      majInfo = "✓ Enregistré, c'est en ligne";
      rendre();
    } catch (e) {
      b.disabled = false; b.textContent = "Enregistrer";
      alert(e.message === "admin" ? "Tu n'as plus les droits admin." : "L'enregistrement n'a pas marché. Réessaie dans un instant.");
    }
  }

  function charger(src) {
    const avecId = (l) => (l || []).map((x) => ({ id: x.id || id(), ...x }));
    etat = {
      events: avecId(src.events), tournois: avecId(src.tournois), jeux: avecId(src.jeux), staff: avecId(src.staff),
      produits: avecId(src.produits).map((p) => ({ tailles: "XS, S, M, L, XL, XXL, XXXL", description: "", ...p, images: p.images && p.images.length ? p.images : p.image ? [p.image] : [] })), palmares: avecId(src.palmares).map((p) => { const c = Array.isArray(p.classement) && p.classement[0]; return { organisateur: "", nbEquipes: null, nbJoueurs: p.participants || null, place: null, ...p, equipe: p.equipe || (c ? c.equipe : "") || "", joueurs: Array.isArray(p.joueurs) ? p.joueurs : c ? c.joueurs || [] : [] }; }), reglement: (src.reglement || []).map((t) => ({ id: id(), texte: t })),
      reglages: { boutiqueEnConstruction: true, ...(NOCTIS.reglages || {}), ...(src.reglages || {}) },
      partenaires: avecId(src.partenaires), streamers: avecId(src.streamers).map((s) => ({ membre: "", ...s })),
    };
    if (src.majLe) majInfo = `Dernière mise à jour le ${new Date(src.majLe).toLocaleString("fr-FR", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" })}${src.majPar ? ` par ${src.majPar}` : ""}`;
  }

  // ----- Classement du palmarès -----
  const valeurMembre = (m) => `${m.nom}${m.username ? ` (@${m.username})` : ""}`;
  function trouverMembre(txt) {
    const t = (txt || "").trim().toLowerCase();
    if (!t || !MEMBRES) return null;
    return MEMBRES.find((m) => valeurMembre(m).toLowerCase() === t) || MEMBRES.find((m) => (m.nom || "").toLowerCase() === t || (m.username || "").toLowerCase() === t) || null;
  }
  function ajouterJoueur(el) {
    const txt = el.value.trim(); if (!txt) return;
    const r = etat[onglet][el.dataset.i].classement[el.dataset.n];
    const m = trouverMembre(txt);
    const j = m ? { membreId: m.id, nom: m.nom, avatar: m.avatar } : { membreId: "", nom: txt, avatar: "" };
    if (!r.joueurs.some((x) => (j.membreId && x.membreId === j.membreId) || x.nom === j.nom)) r.joueurs.push(j);
    modifie = true; rendre();
    const champ = racine.querySelector(`[data-cl="joueur"][data-i="${el.dataset.i}"][data-n="${el.dataset.n}"]`); if (champ) champ.focus();
  }
  racine.addEventListener("input", (ev) => {
    const el = ev.target;
    if (el.dataset.cl === "equipe") {
      etat[onglet][el.dataset.i].classement[el.dataset.n].equipe = el.value; marquer();
      const ap = racine.querySelector(`[data-apercu="${el.dataset.i}"]`); if (ap) ap.textContent = SCHEMA[onglet].apercu(etat[onglet][el.dataset.i], Number(el.dataset.i));
    }
    // choix dans la liste des membres : ajout direct
    if (el.dataset.cl === "joueur" && ev.inputType !== "insertText" && trouverMembre(el.value)) ajouterJoueur(el);
  });
  racine.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter" && ev.target.dataset.cl === "joueur") { ev.preventDefault(); ajouterJoueur(ev.target); }
    if (ev.key === "Enter" && ev.target.dataset.jr) { ev.preventDefault(); ajouterJoueurEquipe(ev.target); }
  });
  // Joueurs de notre équipe (palmarès)
  function ajouterJoueurEquipe(el) {
    const txt = el.value.trim(); if (!txt) return;
    const p = etat[onglet][el.dataset.i]; p.joueurs = Array.isArray(p.joueurs) ? p.joueurs : [];
    const m = trouverMembre(txt);
    const j = m ? { membreId: m.id, nom: m.nom, avatar: m.avatar } : { membreId: "", nom: txt, avatar: "" };
    if (!p.joueurs.some((x) => (j.membreId && x.membreId === j.membreId) || x.nom === j.nom)) p.joueurs.push(j);
    modifie = true; rendre();
    const champ = racine.querySelector(`[data-jr][data-i="${el.dataset.i}"]`); if (champ) champ.focus();
  }
  racine.addEventListener("input", (ev) => { if (ev.target.dataset.jr && ev.inputType !== "insertText" && trouverMembre(ev.target.value)) ajouterJoueurEquipe(ev.target); });
  racine.addEventListener("click", (ev) => {
    const b = ev.target.closest('[data-act="jr-retirer"]'); if (!b) return;
    etat[onglet][b.dataset.i].joueurs.splice(Number(b.dataset.m), 1); modifie = true; rendre();
  });
  racine.addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-act^='cl-']"); if (!b) return;
    const p = etat[onglet][b.dataset.i];
    p.classement = Array.isArray(p.classement) ? p.classement : [];
    if (b.dataset.act === "cl-ajouter") p.classement.push({ equipe: "", joueurs: [] });
    if (b.dataset.act === "cl-suppr") p.classement.splice(Number(b.dataset.n), 1);
    if (b.dataset.act === "cl-retirer") p.classement[b.dataset.n].joueurs.splice(Number(b.dataset.m), 1);
    modifie = true; rendre();
  });

  // Recherche de membres (onglet Staff)
  let minuteur;
  async function chercherMembres(q) {
    const zone = document.getElementById("res-membres");
    if (!zone) return;
    zone.innerHTML = '<li class="res-info">Recherche…</li>';
    try {
      const d = await (await fetch(`/api/admin-membres?q=${encodeURIComponent(q)}`)).json();
      const deja = new Set(etat.staff.map((s) => s.membreId).filter(Boolean));
      zone.innerHTML = (d.membres || []).length ? d.membres.map((m) => `<li>
          <img src="${esc(m.avatar)}" alt=""><span><strong>${esc(m.nom)}</strong><small>@${esc(m.username || "")} · ${m.vu ? `vu sur le site il y a ${depuis(m.vu)}` : "pas encore venu sur le site"}</small></span>
          ${deja.has(m.id) ? '<em>Déjà dans le staff</em>' : `<button type="button" class="btn btn-ghost" data-ajout-membre='${esc(JSON.stringify(m))}'>Ajouter</button>`}</li>`).join("")
        : `<li class="res-info">${q ? "Aucun membre trouvé." : "Aucun membre n'est encore venu sur le site."}</li>`;
      if (d.source === "site" && q) zone.insertAdjacentHTML("beforeend", '<li class="res-info">Recherche limitée aux membres déjà venus sur le site. Active « Server Members Intent » sur le bot pour chercher dans tout le serveur.</li>');
    } catch { zone.innerHTML = '<li class="res-info">La recherche n\'a pas marché, réessaie.</li>'; }
  }
  racine.addEventListener("input", (ev) => {
    if (ev.target.id !== "q-membre") return;
    clearTimeout(minuteur);
    minuteur = setTimeout(() => chercherMembres(ev.target.value.trim()), 350);
  });
  racine.addEventListener("focusin", (ev) => { if (ev.target.id === "q-membre" && !ev.target.value) chercherMembres(""); });
  racine.addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-ajout-membre]");
    if (!b) return;
    const m = JSON.parse(b.dataset.ajoutMembre);
    etat.staff.push({ id: id(), membreId: m.id, username: m.username, nom: m.nom, role: "", couleur: "#c69428", avatar: "", avatarDiscord: m.avatar, vu: m.vu });
    modifie = true; rendre();
    const cartes = racine.querySelectorAll(".carte-admin");
    cartes[cartes.length - 1].scrollIntoView({ behavior: "smooth", block: "center" });
    cartes[cartes.length - 1].querySelector('[data-k="role"]').focus();
  });

  addEventListener("beforeunload", (e) => { if (modifie) { e.preventDefault(); e.returnValue = ""; } });

  Promise.all([initCompte(), chargerContenu()]).then(async () => {
    if (!ADMIN) {
      racine.innerHTML = '<div class="vide" style="margin:0 auto;text-align:center"><h1>Accès réservé</h1><p>Cette page est réservée aux admins du serveur Noctis Core.</p><a class="btn btn-ghost" href="/">Retour à l\'accueil</a></div>';
      return;
    }
    // On part du contenu enregistré, ou à défaut des valeurs actuelles du site
    let enregistre = null;
    try { enregistre = (await (await fetch("/api/contenu")).json()).contenu; } catch {}
    charger(enregistre || NOCTIS);
    await chargerMembres();
    // nom affiché des membres liés aux streamers
    etat.streamers.forEach((s) => { if (s.membreId && !s.membre) { const m = MEMBRES.find((x) => x.id === s.membreId); if (m) s.membre = m.nom; } });
    rendre();
  });
</script>
</body></html>
